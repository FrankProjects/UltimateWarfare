# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: true
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        cookie_secure: auto
        cookie_samesite: lax
        # Expired sessions are only deleted by garbage collection, which php.ini disables on Debian/Ubuntu
        # (session.gc_probability = 0); run it on 1% of requests so old sessions don't stay in the database
        gc_probability: 1
        gc_divisor: 100

    assets:
        version_strategy: FrankProjects\UltimateWarfare\Asset\FileModificationVersionStrategy

    validation:
        email_validation_mode: html5
    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
